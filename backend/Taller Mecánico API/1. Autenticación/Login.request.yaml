$kind: http-request
url: "{{base}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "admin@taller.com",
      "password": "admin123"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('Login 200', () => pm.response.to.have.status(200));
      pm.collectionVariables.set('token', pm.response.json().token);
order: 1000
